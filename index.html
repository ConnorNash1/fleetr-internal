---
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The front matter above makes GitHub Pages' Jekyll build fill in the
         build time below, and in version.json, on every deploy. See
         checkForNewVersion in src/main.js. -->
    <meta name="fleetr-version" content="{{ site.time | date: '%s' }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fleetr internal system</title>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="fleetr ai" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="color-scheme" content="dark light" />
    <style>
      :root {
        --navy: #0a1f3c;
        --green: #00833f;
        --bg: #071426;
        --panel: #0b2242;
        --text: #e7eef8;
        --muted: rgba(231, 238, 248, 0.7);
        --border: rgba(231, 238, 248, 0.12);
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        --radius: 14px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background: #f4f6f9;
        color: #0a1f3c;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      #root {
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Versioned so a fresh page always gets the matching script. Without it,
         the page and main.js are cached separately for 10 minutes each, and a
         new page could run an old script while reporting the new version. -->
    <script type="module" src="./src/main.js?v={{ site.time | date: '%s' }}"></script>
  </body>
</html>
