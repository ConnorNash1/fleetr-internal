# Deploys the staff app to staging (https://staging-internal.fleetr.ai) on every push to main.
# Production stays a manual deploy.
#
# The published copy points at the staging Supabase project and the staging
# Workers, carries a "Staging" banner and noindex, and is refused if anything
# in it still points at production (.github/staging/prepare_site.sh, the same
# file as fleetr-infra's staging/prepare_site.sh). The repo's files are never
# changed.
#
# Needs, under Settings > Secrets and variables > Actions:
#   secrets   CLOUDFLARE_API_TOKEN (Cloudflare Pages: Edit), CLOUDFLARE_ACCOUNT_ID
#   variables STAGING_SUPABASE_URL, STAGING_SUPABASE_ANON_KEY
# and the Cloudflare Pages project fleetr-internal-staging with the custom domain staging-internal.fleetr.ai.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make the staging copy
        env:
          STAGING_SUPABASE_URL: ${{ vars.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_ANON_KEY: ${{ vars.STAGING_SUPABASE_ANON_KEY }}
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude _site ./ _site/
          bash .github/staging/prepare_site.sh _site
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.163.0 pages deploy _site --project-name fleetr-internal-staging --branch main --commit-dirty=true
